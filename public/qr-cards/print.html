<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>入室QRカード印刷</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #f5f5f5;
  font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
}

/* ── 画面表示用コントロール ── */
.controls {
  background: #fff;
  border-bottom: 2px solid #00C0C7;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.controls h1 { font-size: 18px; color: #333; flex: 1; }
.print-btn {
  background: #00C0C7;
  color: white;
  border: none;
  padding: 12px 32px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}
.print-btn:hover { background: #0097A7; }
.close-btn {
  background: #f0f0f0;
  color: #333;
  border: none;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
}

/* ── カードグリッド（画面表示） ── */
.cards-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  padding: 24px;
  justify-content: center;
  max-width: 900px;
  margin: 0 auto;
}

/* ── 1枚のカード（名刺サイズ・横長レイアウト） ── */
.qr-card {
  width: 91mm;
  height: 55mm;
  background: #FFFFFF;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  border: 2px solid #00C0C7;
  display: flex;
  flex-direction: row;
}

.card-left {
  width: 40%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff;
  border-right: 1px dashed #ddd;
}

.card-qr {
  display: flex;
  justify-content: center;
  align-items: center;
}
.card-qr canvas, .card-qr img {
  width: 28mm !important;
  height: 28mm !important;
}

.card-right {
  width: 60%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card-header {
  background: #00C0C7;
  padding: 6px;
  text-align: center;
}
.card-title {
  color: white;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
}
.card-subtitle {
  color: rgba(255,255,255,0.9);
  font-size: 8px;
}

.card-body {
  padding: 6px 10px;
  text-align: center;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.card-name {
  font-size: 16px;
  font-weight: bold;
  color: #333;
  margin-bottom: 4px;
}
.card-school {
  font-size: 11px;
  color: #666;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-footer {
  background: #E0F7FA;
  padding: 5px;
  text-align: center;
  border-top: 1px solid #B2EBF2;
}
.card-footer-text {
  font-size: 9px;
  color: #00838F;
  font-weight: bold;
}

/* ── 印刷スタイル ── */
@media print {
  @page {
    size: A4 portrait;
    margin: 10mm 15mm;
  }
  .controls { display: none !important; }
  html, body { background: white; }

  /* 2列×5行 = 1ページ10枚。自動改ページ */
  .cards-grid {
    padding: 0;
    display: grid;
    grid-template-columns: repeat(2, 91mm);
    gap: 4mm 10mm;
    width: auto;
    max-width: none;
    justify-content: center;
  }

  .qr-card {
    width: 91mm;
    height: 55mm;
    box-shadow: none;
    page-break-inside: avoid;
    break-inside: avoid;
    border: 1pt solid #00C0C7;
    border-radius: 4pt;
  }

  .card-title { font-size: 8pt; }
  .card-subtitle { font-size: 6pt; }
  .card-name { font-size: 14pt; }
  .card-school { font-size: 9pt; }
  .card-footer-text { font-size: 7pt; }
}

.loading-msg {
  text-align: center;
  padding: 48px;
  color: #888;
  font-size: 16px;
}
.error-msg {
  text-align: center;
  padding: 48px;
  color: #E74C3C;
  font-size: 16px;
}
</style>
</head>
<body>

<div class="controls">
  <h1>📇 入室QRカード印刷プレビュー</h1>
  <button class="close-btn" onclick="window.history.back()">← 戻る</button>
  <button class="print-btn" onclick="window.print()">🖨️ 印刷する</button>
</div>

<div id="cards-grid" class="cards-grid">
  <div class="loading-msg">QRコードを生成中...</div>
</div>

<script>
// URLパラメーターから子供データを取得
(function() {
  const params = new URLSearchParams(window.location.search);
  const grid = document.getElementById('cards-grid');

  let children = [];
  let baseUrl = window.location.origin;

  // sessionStorage経由（src=session）
  if (params.get('src') === 'session') {
    try {
      const raw = sessionStorage.getItem('qr_print_data');
      if (raw) {
        const parsed = JSON.parse(raw);
        children = parsed.children || [];
        baseUrl = parsed.baseUrl || baseUrl;
      }
    } catch(e) {
      grid.innerHTML = '<div class="error-msg">データの読み込みに失敗しました。再度お試しください。</div>';
      return;
    }
  }

  if (!children.length) {
    grid.innerHTML = '<div class="error-msg">印刷する子供のデータがありません。</div>';
    return;
  }

  grid.innerHTML = '';

  children.forEach(function(child, index) {
    // 既にqrCodeUrlがある場合はそれを使う、なければ従来のid方式
    const qrUrl = child.qrCodeUrl || (baseUrl + '/qr-scan?id=' + child.id);

    // カードDOM生成（横長・名刺レイアウト）
    const card = document.createElement('div');
    card.className = 'qr-card';
    card.innerHTML = `
      <div class="card-left">
        <div class="card-qr" id="qr-${index}"></div>
      </div>
      <div class="card-right">
        <div class="card-header">
          <div class="card-title">ケーニーズ学童クラブ</div>
          <div class="card-subtitle">入室確認 QRカード</div>
        </div>
        <div class="card-body">
          <div class="card-name">${escapeHtml(child.name)}</div>
          <div class="card-school">${escapeHtml(child.school || '')}</div>
        </div>
        <div class="card-footer">
          <div class="card-footer-text">入室時にスキャンしてね</div>
        </div>
      </div>
    `;

    grid.appendChild(card);

    // QRコード生成
    try {
      new QRCode(document.getElementById('qr-' + index), {
        text: qrUrl,
        width: 100, // 高解像度のために少し大きめに生成してCSSで縮小表示
        height: 100,
        colorDark: '#1a1a1a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M,
      });
    } catch(e) {
      document.getElementById('qr-' + index).innerHTML = '<div style="color:red;font-size:10px;padding:8px">QR生成失敗</div>';
    }
  });
})();

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
</body>
</html>
