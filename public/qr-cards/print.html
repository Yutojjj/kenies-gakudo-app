<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>入室QRカード印刷</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ── 基本リセット ── */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #f5f5f5;
  font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
}

/* ── 画面表示用コントロール（印刷時は非表示） ── */
.controls {
  background: #fff;
  border-bottom: 2px solid #00C0C7;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.controls h1 { font-size: 16px; color: #333; flex: 1; }
.print-btn {
  background: #00C0C7;
  color: white;
  border: none;
  padding: 10px 24px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.close-btn {
  background: #eee;
  color: #333;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}

/* ── カードグリッド ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(2, 91mm); /* 2列 */
  gap: 2mm 4mm; /* カード間の隙間 */
  padding: 10mm; /* 画面上での余白 */
  justify-content: center;
}

/* ── 1枚のカード（名刺サイズ 91x55mm） ── */
.qr-card {
  width: 91mm;
  height: 55mm;
  background: #FFFFFF;
  border: 0.3mm solid #00C0C7; /* 線の太さを少し細くして印刷ずれに対応 */
  border-radius: 5mm;
  overflow: hidden;
  display: flex;
  flex-direction: row;
  position: relative;
  page-break-inside: avoid;
}

/* 左側：QRコードエリア */
.card-left {
  width: 38%;
  display: flex;
  justify-content: center;
  align-items: center;
  border-right: 0.2mm dashed #00C0C7;
}
.card-qr {
  display: flex;
  justify-content: center;
  align-items: center;
}
/* QRのサイズ調整 */
.card-qr canvas, .card-qr img {
  width: 30mm !important;
  height: 30mm !important;
}

/* 右側：コンテンツエリア */
.card-right {
  width: 62%;
  display: flex;
  flex-direction: column;
}

/* カード上部：タイトル */
.card-header {
  background: #00C0C7;
  padding: 4mm 2mm 3mm;
  text-align: center;
}
.card-title {
  color: white;
  font-size: 10pt;
  font-weight: bold;
  line-height: 1;
}
.card-subtitle {
  color: rgba(255,255,255,0.9);
  font-size: 7pt;
  margin-top: 1mm;
}

/* カード中央：イラストと名前 */
.card-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2mm;
}
.card-illustration {
  width: 18mm;
  height: 18mm;
  object-fit: contain;
  margin-bottom: 1mm;
}
.card-name {
  font-size: 14pt;
  font-weight: bold;
  color: #333;
  margin-bottom: 0.5mm;
}
.card-school {
  font-size: 8pt;
  color: #666;
  font-weight: bold;
}

/* カード下部：フッター */
.card-footer {
  background: #f0fbfc;
  padding: 2mm;
  text-align: center;
  border-top: 0.1mm solid #00C0C7;
}
.card-footer-text {
  font-size: 8pt;
  color: #00C0C7;
  font-weight: bold;
}

/* ── 印刷用設定 ── */
@media print {
  @page {
    size: A4 portrait;
    margin: 5mm; /* プリンタの最小余白に合わせる */
  }
  html, body {
    background: white;
  }
  .controls {
    display: none !important;
  }
  .cards-grid {
    padding: 0;
    margin: 0 auto;
    gap: 2mm 4mm; /* 紙のサイズに収まるよう調整 */
  }
  .qr-card {
    box-shadow: none !important; /* 印刷時は影を消す */
  }
}

/* メッセージ用 */
.loading-msg, .error-msg {
  grid-column: span 2;
  text-align: center;
  padding: 50px;
  font-size: 18px;
  color: #888;
}
</style>
</head>
<body>

<div class="controls">
  <h1>📇 入室QRカード 印刷プレビュー (A4 1枚につき10枚)</h1>
  <button class="close-btn" onclick="window.close()">閉じる</button>
  <button class="print-btn" onclick="window.print()">🖨️ 印刷を開始する</button>
</div>

<div id="cards-grid" class="cards-grid">
  <div class="loading-msg">QRコードを生成中...</div>
</div>

<script>
// ポケモンイラストの枚数
const TOTAL_ILLUSTRATIONS = 10;

(function() {
  const params = new URLSearchParams(window.location.search);
  const grid = document.getElementById('cards-grid');

  let children = [];
  let baseUrl = window.location.origin;

  // データの読み込み
  if (params.get('src') === 'session') {
    try {
      const raw = sessionStorage.getItem('qr_print_data');
      if (raw) {
        const parsed = JSON.parse(raw);
        children = parsed.children || [];
        baseUrl = parsed.baseUrl || baseUrl;
      }
    } catch(e) {
      grid.innerHTML = '<div class="error-msg">データの取得に失敗しました。</div>';
      return;
    }
  }

  if (!children.length) {
    grid.innerHTML = '<div class="error-msg">印刷する対象が選択されていません。</div>';
    return;
  }

  grid.innerHTML = '';

  children.forEach(function(child, index) {
    const qrUrl = child.qrCodeUrl || (baseUrl + '/qr-scan?id=' + child.id);
    
    // イラストをランダムに選択（1〜TOTAL_ILLUSTRATIONS）
    const randomImageId = Math.floor(Math.random() * TOTAL_ILLUSTRATIONS) + 1;
    const imageUrl = '/illustrations/' + randomImageId + '.png';

    const card = document.createElement('div');
    card.className = 'qr-card';
    card.innerHTML = `
      <div class="card-left">
        <div class="card-qr" id="qr-${index}"></div>
      </div>
      <div class="card-right">
        <div class="card-header">
          <div class="card-title">ケーニーズ学童クラブ</div>
          <div class="card-subtitle">入室確認 QRカード</div>
        </div>
        <div class="card-body">
          <img src="${imageUrl}" class="card-illustration" alt="icon" onerror="this.style.visibility='hidden'">
          <div class="card-name">${escapeHtml(child.name)}</div>
          <div class="card-school">${escapeHtml(child.school || '')}</div>
        </div>
        <div class="card-footer">
          <div class="card-footer-text">入室時にスキャンしてね</div>
        </div>
      </div>
    `;

    grid.appendChild(card);

    // QR生成
    try {
      new QRCode(document.getElementById('qr-' + index), {
        text: qrUrl,
        width: 120,
        height: 120,
        colorDark: '#333333',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch(e) {
      console.error(e);
    }
  });
})();

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
</body>
</html>
