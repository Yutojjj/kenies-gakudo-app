<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>入室QRカード印刷</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ── 基本リセット ── */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #f5f5f5;
  font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* ── 画面表示用コントロール（印刷時は非表示） ── */
.controls {
  background: #fff;
  border-bottom: 2px solid #00C0C7;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.controls h1 { font-size: 16px; color: #333; flex: 1; }
.print-btn {
  background: #00C0C7;
  color: white;
  border: none;
  padding: 10px 24px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.close-btn {
  background: #eee;
  color: #333;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}

/* ── カードグリッド ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(2, 91mm); /* 横2列に固定 */
  gap: 4mm 6mm; /* 上下左右のカード間の適度な隙間 */
  padding: 10mm;
  justify-content: center;
}

/* ── 1枚のカード（名刺サイズ 91x55mm） ── */
.qr-card {
  width: 91mm;
  height: 55mm;
  background: #FFFFFF;
  border: 0.4mm solid #00C0C7; /* 枠線が途切れないよう少しだけ存在感を調整 */
  border-radius: 4mm;
  overflow: hidden;
  display: flex;
  flex-direction: row;
  position: relative;
  page-break-inside: avoid;
  break-inside: avoid;
}

/* 左側：QRコードエリア */
.card-left {
  width: 40%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #FFFFFF;
  border-right: 0.3mm dashed #00C0C7; /* 切り取り線風の点線 */
  padding: 2mm;
}
.card-qr {
  display: flex;
  justify-content: center;
  align-items: center;
}
/* QRコードが完全に収まり、かつ小さすぎないベストサイズ */
.card-qr canvas, .card-qr img {
  width: 29mm !important;
  height: 29mm !important;
}

/* 右側：コンテンツエリア */
.card-right {
  width: 60%;
  display: flex;
  flex-direction: column;
  background: #FFFFFF;
}

/* カード上部：ヘッダー */
.card-header {
  background: #00C0C7;
  padding: 4mm 2mm;
  text-align: center;
}
.card-title {
  color: white;
  font-size: 11pt;
  font-weight: bold;
  letter-spacing: 0.5px;
  line-height: 1.2;
}
.card-subtitle {
  color: rgba(255,255,255,0.9);
  font-size: 7.5pt;
  font-weight: 500;
  margin-top: 0.8mm;
  letter-spacing: 0.5px;
}

/* カード中央：イラストとお名前、学校名（フッター削除分、縦に広々と綺麗に配置） */
.card-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2mm 3mm 3mm;
}
.card-illustration {
  width: 18mm;
  height: 18mm;
  object-fit: contain;
  margin-bottom: 1.5mm;
}
.card-name {
  font-size: 15pt;
  font-weight: bold;
  color: #222222;
  margin-bottom: 0.8mm;
  text-align: center;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-school {
  font-size: 8.5pt;
  color: #666666;
  font-weight: bold;
  text-align: center;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── 印刷用設定 ── */
@media print {
  @page {
    size: A4 portrait;
    margin: 8mm 10mm; /* 上下左右の余白を最適化して途切れを完全に防止 */
  }
  html, body {
    background: white;
  }
  .controls {
    display: none !important; /* コントロールバーは非表示 */
  }
  .cards-grid {
    padding: 0;
    margin: 0 auto;
    gap: 4mm 6mm;
  }
  .qr-card {
    box-shadow: none !important;
    border: 0.4mm solid #00C0C7 !important; /* 印刷時も枠線を維持 */
  }
}

/* メッセージ用 */
.loading-msg, .error-msg {
  grid-column: span 2;
  text-align: center;
  padding: 50px;
  font-size: 16px;
  color: #888;
}
</style>
</head>
<body>

<div class="controls">
  <h1>📇 入室QRカード 印刷プレビュー (A4 1枚につき最大10枚)</h1>
  <button class="close-btn" onclick="window.close()">閉じる</button>
  <button class="print-btn" onclick="window.print()">🖨️ 印刷を開始する</button>
</div>

<div id="cards-grid" class="cards-grid">
  <div class="loading-msg">QRコードを生成中...</div>
</div>

<script>
// ポケモンイラストの総枚数（実際の枚数に合わせて調整してください）
const TOTAL_ILLUSTRATIONS = 10;

(function() {
  const params = new URLSearchParams(window.location.search);
  const grid = document.getElementById('cards-grid');

  let children = [];
  let baseUrl = window.location.origin;

  // データの取得（SessionStorage経由）
  if (params.get('src') === 'session') {
    try {
      const raw = sessionStorage.getItem('qr_print_data');
      if (raw) {
        const parsed = JSON.parse(raw);
        children = parsed.children || [];
        baseUrl = parsed.baseUrl || baseUrl;
      }
    } catch(e) {
      grid.innerHTML = '<div class="error-msg">データの取得に失敗しました。画面を閉じてやり直してください。</div>';
      return;
    }
  }

  if (!children.length) {
    grid.innerHTML = '<div class="error-msg">印刷する対象の児童が選択されていません。</div>';
    return;
  }

  grid.innerHTML = '';

  children.forEach(function(child, index) {
    const qrUrl = child.qrCodeUrl || (baseUrl + '/qr-scan?id=' + child.id);
    
    // イラストをランダムに選択（1〜TOTAL_ILLUSTRATIONS）
    const randomImageId = Math.floor(Math.random() * TOTAL_ILLUSTRATIONS) + 1;
    const imageUrl = '/illustrations/' + randomImageId + '.png';

    const card = document.createElement('div');
    card.className = 'qr-card';
    card.innerHTML = `
      <div class="card-left">
        <div class="card-qr" id="qr-${index}"></div>
      </div>
      <div class="card-right">
        <div class="card-header">
          <div class="card-title">ケーニーズクラブ学童保育</div>
          <div class="card-subtitle">入室QRカード</div>
        </div>
        <div class="card-body">
          <img src="${imageUrl}" class="card-illustration" alt="icon" onerror="this.style.visibility='hidden'">
          <div class="card-name">${escapeHtml(child.name)}</div>
          <div class="card-school">${escapeHtml(child.school || '')}</div>
        </div>
      </div>
    `;

    grid.appendChild(card);

    // QRコードの生成
    try {
      new QRCode(document.getElementById('qr-' + index), {
        text: qrUrl,
        width: 120,
        height: 120,
        colorDark: '#1a1a1a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch(e) {
      console.error(e);
    }
  });
})();

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
</body>
</html>
