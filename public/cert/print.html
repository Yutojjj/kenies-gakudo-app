<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タイピング検定認定書</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 210mm;
  height: 297mm;
  background: white;
}

/* 画面表示用：mm単位でA4に合わせる */
.cert-container {
  position: relative;
  width: 210mm;
  height: 297mm;
  overflow: hidden;
}
.cert-container img.bg {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; display: block;
}

/* テキストはA4(210×297mm)基準の% or mm指定 */
.field-text {
  position: absolute;
  font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
  font-weight: bold;
  white-space: nowrap;
  color: #1a3a6b;
}
.color-kuro { color: #111111; }
.color-aka  { color: #c00000; }
.color-ki   { color: #b07d00; }

/*
  座標変換: 元画像794×1123px → A4 210×297mm
  x_mm = x_px / 794 * 210
  y_mm = y_px / 1123 * 297
  font_mm = font_px / 794 * 210
*/

/* ── 合格レイアウト ── */
/* name:      x=296 y=358 font=56 */
#f-name      { top: 94.6mm; left: 78.2mm; font-size: 14.8mm; }
/* date:      x=334 y=690 font=30 */
#f-date      { top: 182.5mm; left: 88.3mm; font-size: 7.9mm; }
/* grade:     x=180 y=751 font=44 */
#f-grade     { top: 198.6mm; left: 47.6mm; font-size: 11.6mm; }
/* score:     x=255 y=821 font=44 */
#f-score     { top: 217.1mm; left: 67.4mm; font-size: 11.6mm; }
/* wpm:       x=561 y=816 font=44 */
#f-wpm       { top: 215.8mm; left: 148.3mm; font-size: 11.6mm; }
/* certifier: x=218 y=950 font=25 */
#f-certifier { top: 251.3mm; left: 57.6mm; font-size: 6.6mm; }

/* ── 不合格レイアウト ── */
/* name:      x=285 y=370 font=56 */
#f-name.fail      { top: 97.8mm; left: 75.3mm; font-size: 14.8mm; }
/* date:      x=249 y=491 font=39 */
#f-date.fail      { top: 129.8mm; left: 65.8mm; font-size: 10.3mm; }
/* grade:     x=426 y=593 font=42 */
#f-grade.fail     { top: 156.8mm; left: 112.6mm; font-size: 11.1mm; }
/* score:     x=240 y=719 font=42 */
#f-score.fail     { top: 190.1mm; left: 63.4mm; font-size: 11.1mm; }
/* wpm:       x=543 y=719 font=38 */
#f-wpm.fail       { top: 190.1mm; left: 143.5mm; font-size: 10.0mm; }
/* certifier: x=267 y=839 font=37 */
#f-certifier.fail { top: 221.9mm; left: 70.6mm; font-size: 9.8mm; }

@media print {
  @page {
    size: A4 portrait;
    margin: 0;
  }
  html, body {
    width: 210mm;
    height: 297mm;
    margin: 0;
    padding: 0;
  }
  .cert-container {
    width: 210mm;
    height: 297mm;
    page-break-inside: avoid;
  }
  #back-btn { display: none; }
}

#back-btn {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 9999;
  padding: 8px 18px;
  background: #1a3a6b;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
#back-btn:hover { background: #2a5298; }
</style>
</head>
<body>
<button id="back-btn" onclick="window.history.back()">← 戻る</button>
<div class="cert-container" id="cert">
  <img class="bg" id="cert-bg" src="" alt="">
  <span class="field-text" id="f-name"></span>
  <span class="field-text" id="f-date"></span>
  <span class="field-text" id="f-grade"></span>
  <span class="field-text" id="f-score"></span>
  <span class="field-text" id="f-wpm"></span>
  <span class="field-text" id="f-certifier"></span>
</div>

<script>
const STAR_LABEL = { kuro: '黒★', aka: '赤★', ki: '黄★' };
const STAR_CLASS  = { kuro: 'color-kuro', aka: 'color-aka', ki: 'color-ki' };

const params    = new URLSearchParams(location.search);
const result    = params.get('result')    || 'pass';
const name      = params.get('name')      || '';
const kana      = params.get('kana')      || '';
const date      = params.get('date')      || '';
const star      = params.get('star')      || 'kuro';
const grade     = params.get('grade')     || '';
const score     = params.get('score')     || '';
const wpm       = params.get('wpm')       || '';
const certifier = params.get('certifier') || '';

document.getElementById('cert-bg').src =
  result === 'pass' ? 'cert-pass.png' : 'cert-fail.png';

function formatDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return `${y}年${m}月${d}日`;
}

const fail = result === 'fail';

// 氏名（ルビ付き）
const nameEl = document.getElementById('f-name');
nameEl.className = 'field-text' + (fail ? ' fail' : '');
if (kana) {
  nameEl.innerHTML = `<ruby>${name}<rt style="font-weight:bold;font-size:0.35em">${kana}</rt></ruby>`;
} else {
  nameEl.textContent = name;
}

// その他フィールド
const set = (id, text, colorClass, isFail) => {
  const el = document.getElementById(id);
  el.textContent = text;
  if (colorClass) el.classList.add(colorClass);
  if (isFail)     el.classList.add('fail');
};

const gradeText = (STAR_LABEL[star] || '') + ' ' + grade;
set('f-date',      formatDate(date), null,             fail);
set('f-grade',     gradeText,        STAR_CLASS[star], fail);
set('f-score',     score,            null,             fail);
set('f-wpm',       wpm,              null,             fail);
set('f-certifier', certifier,        null,             fail);

// 画像読み込み後に印刷、印刷後に自動で戻る
document.getElementById('cert-bg').onload = () => {
  setTimeout(() => {
    window.print();
    // 印刷ダイアログを閉じたら自動で前の画面に戻る
    window.addEventListener('afterprint', () => {
      window.history.back();
    }, { once: true });
  }, 300);
};
// 戻ったときにリロードしてFirestoreデータを再取得させる
window.addEventListener('pageshow', (e) => {
  if (e.persisted) window.location.reload();
});
</script>
</body>
</html>
